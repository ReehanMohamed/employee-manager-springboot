
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

          <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Employee Management System</h2>

        <a th:href="@{/employees/new}" class="btn btn-primary">
            + Add Employee
        </a>
    </div>

    <!-- Employee Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <h5 class="card-title mb-3">Employee List</h5>

            <table class="table table-bordered table-striped">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Job Title</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="employee : ${employees}">

                    <td th:text="${employee.id}"></td>

                    <td th:text="${employee.fullName}"></td>

                    <td th:text="${employee.email}"></td>

                    <td th:text="${employee.jobTitle}"></td>

                    <td th:text="${employee.salary}"></td>

                    <td>
                        <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <form th:action="@{/employees/delete/{id}(id=${employee.id})}"
                              method="post"
                              style="display:inline">

                            <button type="submit"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Are you sure you want to delete this employee?')">
                                Delete
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="text-center">
                        No employees found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
